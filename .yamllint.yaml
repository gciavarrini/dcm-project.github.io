# Yamllint configuration for Hugo sites and GitHub Actions
extends: default

rules:
  # GitHub Actions and Hugo don't require document start
  document-start: disable
  # GitHub Actions uses 'on:' which triggers truthy warnings
  truthy: disable
  # URLs and long strings often exceed 80 chars
  line-length: disable
  # Allow flexible blank lines
  empty-lines:
    max: 1
    max-start: 0
    max-end: 1
